name: Publish the eight literary works
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect the static website
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R hu-xin-ting-kan-xue yueyang-lou-ji zuiweng-ting-ji shi-hao-li mao-wu-wei-qiu-feng-suo-po-ge xiao-shi-tan-ji teng-wang-ge-xu tian-jing-sha-qiu-si _site/
          if [ -d assets ]; then cp -R assets _site/; fi
          if [ -f CNAME ]; then cp CNAME _site/; fi
          find _site -type f -name '*.md' -delete
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
